<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Thực hành Flex-wrap</title>
    <style>
        .container {
            display: flex;
            /* Đổi giá trị flex-wrap ở dòng dưới đây */
            flex-wrap: nowrap; 
            width: 600px;
            height: 300px;
            gap: 10px;
            border: 2px solid black;
            background-color: #f4f4f4;
            margin-bottom: 20px;
        }

        .item {
            width: 180px;
            height: 80px;
            padding: 20px;
            background-color: lightblue;
            text-align: center;
            font-size: 24px;
            font-weight: bold;
            box-sizing: border-box;
        }
    </style>
</head>
<body>

    <h2>Thử nghiệm flex-wrap</h2>
    <div class="container">
        <div class="item">1</div>
        <div class="item">2</div>
        <div class="item">3</div>
        <div class="item">4</div>
        <div class="item">5</div>
        <div class="item">6</div>
    </div>

</body>
</html>
